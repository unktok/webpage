<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AI may open more of the design space of possible sciences</title>
  <desc id="desc">The science we inherited occupies a small region within a much larger design space of possible sciences. AI may make a larger region of that space possible to build and test.</desc>
  <defs>
    <style>
      .space{font:700 19px Arial,sans-serif;letter-spacing:3px;fill:#426b63}
      .ai{font:700 22px Arial,sans-serif;letter-spacing:1.8px;fill:#92506a}
      .current{font:700 24px Arial,sans-serif;letter-spacing:1.7px;fill:#fffaf2}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f6f1e8"/>
  <ellipse cx="600" cy="350" rx="550" ry="315" fill="#e2ece8"/>
  <text x="600" y="125" text-anchor="middle" class="space">DESIGN SPACE OF POSSIBLE SCIENCES</text>

  <ellipse cx="600" cy="390" rx="390" ry="220" fill="#f3e0e7" stroke="#c97894" stroke-width="2.5"/>
  <text x="600" y="252" text-anchor="middle" class="ai">AI MAY MAKE MORE</text>
  <text x="600" y="287" text-anchor="middle" class="ai">OF THIS SPACE POSSIBLE</text>
  <text x="600" y="322" text-anchor="middle" class="ai">TO BUILD AND TEST</text>

  <ellipse cx="600" cy="470" rx="170" ry="84" fill="#2d2730"/>
  <text x="600" y="463" text-anchor="middle" class="current">SCIENCE WE</text>
  <text x="600" y="497" text-anchor="middle" class="current">INHERITED</text>
</svg>
