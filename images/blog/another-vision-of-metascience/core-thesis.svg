<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">AI makes science itself explorable</title>
  <desc id="desc">A single inherited scientific system passes through AI as an experimental medium and branches into multiple possible forms of science. The figure argues that we should not only predict how AI will change science, but explore which forms of science we want to make possible.</desc>
  <defs>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a55570"/>
    </marker>
    <style>
      .display{font:500 54px Georgia,serif;fill:#29242b}
      .subtitle{font:400 23px Arial,sans-serif;fill:#655f68}
      .kicker{font:700 15px Arial,sans-serif;letter-spacing:3.2px;fill:#8d4e63}
      .section{font:500 31px Georgia,serif;fill:#29242b}
      .label{font:700 19px Arial,sans-serif;fill:#29242b}
      .small{font:400 18px Arial,sans-serif;fill:#665f68}
      .micro{font:700 14px Arial,sans-serif;letter-spacing:1.8px;fill:#8d4e63}
      .cream{fill:#fffaf2}
      .dark{fill:#2d2730}
      .rose-line{fill:none;stroke:#a55570;stroke-width:3;stroke-linecap:round;marker-end:url(#arrowRose)}
      .network{fill:none;stroke:#fffaf2;stroke-width:2.5;opacity:.9}
      .network-dark{fill:none;stroke:#3e6e65;stroke-width:2.5;opacity:.9}
    </style>
  </defs>

  <rect x="1" y="1" width="1438" height="958" rx="38" fill="#f6f1e8" stroke="#d9d0c3" stroke-width="2"/>
  <text x="86" y="72" class="kicker">THE CENTRAL PROPOSITION</text>
  <text x="86" y="130" class="display">AI makes science itself explorable.</text>
  <text x="86" y="171" class="subtitle">Not only the questions inside a scientific system—but the design of the system that asks them.</text>

  <rect x="72" y="214" width="1296" height="500" rx="36" fill="#ecefe9"/>
  <text x="112" y="263" class="kicker" fill="#557f76">THE DESIGN SPACE OF SCIENCE</text>
  <text x="112" y="303" class="section">Today’s arrangement is one possibility, not the boundary.</text>

  <!-- The inherited system -->
  <circle cx="270" cy="481" r="112" class="dark"/>
  <path d="M220 437L277 414L326 450L310 513L252 539L211 496Z M220 437L310 513 M277 414L252 539 M326 450L211 496" class="network"/>
  <circle cx="220" cy="437" r="10" class="cream"/><circle cx="277" cy="414" r="10" class="cream"/>
  <circle cx="326" cy="450" r="10" class="cream"/><circle cx="310" cy="513" r="10" class="cream"/>
  <circle cx="252" cy="539" r="10" class="cream"/><circle cx="211" cy="496" r="10" class="cream"/>
  <text x="270" y="628" text-anchor="middle" class="micro">ONE INHERITED SYSTEM</text>
  <text x="270" y="655" text-anchor="middle" class="small">Its roles and rules feel fixed.</text>

  <!-- AI as experimental medium -->
  <path d="M390 481H487" class="rose-line"/>
  <rect x="505" y="396" width="352" height="170" rx="28" fill="#f7e7ed" stroke="#c97894" stroke-width="2"/>
  <text x="681" y="438" text-anchor="middle" class="micro">AI SCIENTIST AS AN</text>
  <text x="681" y="469" text-anchor="middle" class="micro">EXPERIMENTAL MEDIUM</text>
  <text x="681" y="510" text-anchor="middle" class="label">Build, run, and compare</text>
  <text x="681" y="540" text-anchor="middle" class="small">whole scientific systems.</text>

  <!-- Branching paths -->
  <path d="M857 449C922 418 939 371 983 349" class="rose-line"/>
  <path d="M857 481H985" class="rose-line"/>
  <path d="M857 513C922 544 939 591 983 613" class="rose-line"/>

  <!-- Plural possible sciences -->
  <circle cx="1092" cy="337" r="75" fill="#fffaf2" stroke="#6f9c91" stroke-width="2"/>
  <path d="M1056 311L1102 294L1132 330L1110 371L1063 357Z M1056 311L1110 371 M1102 294L1063 357" class="network-dark"/>
  <circle cx="1056" cy="311" r="8" fill="#6f9c91"/><circle cx="1102" cy="294" r="8" fill="#6f9c91"/>
  <circle cx="1132" cy="330" r="8" fill="#6f9c91"/><circle cx="1110" cy="371" r="8" fill="#6f9c91"/><circle cx="1063" cy="357" r="8" fill="#6f9c91"/>

  <rect x="1017" y="423" width="150" height="116" rx="58" fill="#fffaf2" stroke="#6f9c91" stroke-width="2"/>
  <path d="M1054 482H1130M1092 451V511M1054 482L1092 451L1130 482L1092 511Z" class="network-dark"/>
  <circle cx="1054" cy="482" r="8" fill="#6f9c91"/><circle cx="1130" cy="482" r="8" fill="#6f9c91"/>
  <circle cx="1092" cy="451" r="8" fill="#6f9c91"/><circle cx="1092" cy="511" r="8" fill="#6f9c91"/>

  <rect x="1017" y="570" width="150" height="116" rx="24" fill="#fffaf2" stroke="#6f9c91" stroke-width="2"/>
  <path d="M1047 605H1137M1047 628H1137M1047 651H1137" class="network-dark"/>
  <circle cx="1070" cy="605" r="8" fill="#6f9c91"/><circle cx="1117" cy="605" r="8" fill="#6f9c91"/>
  <circle cx="1057" cy="628" r="8" fill="#6f9c91"/><circle cx="1092" cy="628" r="8" fill="#6f9c91"/><circle cx="1127" cy="628" r="8" fill="#6f9c91"/>
  <circle cx="1070" cy="651" r="8" fill="#6f9c91"/><circle cx="1117" cy="651" r="8" fill="#6f9c91"/>

  <text x="1210" y="431" class="micro">MANY POSSIBLE</text>
  <text x="1210" y="456" class="micro">SCIENCES</text>
  <text x="1210" y="491" class="small">Different actors</text>
  <text x="1210" y="516" class="small">Knowledge forms</text>
  <text x="1210" y="541" class="small">Evaluation rules</text>
  <text x="1210" y="566" class="small">Resource flows</text>
  <text x="1210" y="591" class="small">Authority</text>

  <!-- Learning condition -->
  <rect x="142" y="749" width="1156" height="70" rx="35" fill="#dfece8" stroke="#7da69d" stroke-width="2"/>
  <text x="720" y="792" text-anchor="middle" class="label">IMAGINE  →  BUILD  →  TEST AGAINST THE WORLD  →  SHARE WHAT HAPPENED  →  FORK</text>

  <text x="720" y="872" text-anchor="middle" class="small">Do not only ask how AI will change science.</text>
  <text x="720" y="919" text-anchor="middle" style="font:500 35px Georgia,serif;fill:#29242b">Ask what kinds of science we want to make possible.</text>
</svg>
