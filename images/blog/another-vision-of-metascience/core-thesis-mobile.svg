<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">AI may open more of the design space of possible sciences</title>
  <desc id="desc">The science we inherited occupies a small region within a much larger design space of possible sciences. AI may make a larger region of that space possible to build and test.</desc>
  <defs>
    <style>
      .space{font:700 23px Arial,sans-serif;letter-spacing:2.1px;fill:#426b63}
      .ai{font:700 24px Arial,sans-serif;letter-spacing:1.2px;fill:#92506a}
      .current{font:700 25px Arial,sans-serif;letter-spacing:1.3px;fill:#fffaf2}
    </style>
  </defs>

  <rect width="720" height="820" fill="#f6f1e8"/>
  <ellipse cx="360" cy="410" rx="310" ry="380" fill="#e2ece8"/>
  <text x="360" y="128" text-anchor="middle" class="space">DESIGN SPACE OF</text>
  <text x="360" y="163" text-anchor="middle" class="space">POSSIBLE SCIENCES</text>

  <ellipse cx="360" cy="455" rx="250" ry="265" fill="#f3e0e7" stroke="#c97894" stroke-width="2.5"/>
  <text x="360" y="268" text-anchor="middle" class="ai">AI MAY MAKE MORE</text>
  <text x="360" y="305" text-anchor="middle" class="ai">OF THIS SPACE</text>
  <text x="360" y="342" text-anchor="middle" class="ai">POSSIBLE TO BUILD</text>
  <text x="360" y="379" text-anchor="middle" class="ai">AND TEST</text>

  <ellipse cx="360" cy="555" rx="165" ry="94" fill="#2d2730"/>
  <text x="360" y="547" text-anchor="middle" class="current">SCIENCE WE</text>
  <text x="360" y="583" text-anchor="middle" class="current">INHERITED</text>
</svg>
