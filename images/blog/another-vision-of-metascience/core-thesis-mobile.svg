<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI makes science itself explorable</title>
  <desc id="desc">A single inherited scientific system passes through AI as an experimental medium and branches into multiple possible forms of science. The figure argues that we should not only predict how AI will change science, but explore which forms of science we want to make possible.</desc>
  <defs>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a55570"/>
    </marker>
    <style>
      .display{font:500 46px Georgia,serif;fill:#29242b}
      .subtitle{font:400 26px Arial,sans-serif;fill:#655f68}
      .kicker{font:700 25px Arial,sans-serif;letter-spacing:2.7px;fill:#8d4e63}
      .section{font:500 31px Georgia,serif;fill:#29242b}
      .label{font:700 27px Arial,sans-serif;fill:#29242b}
      .small{font:400 25px Arial,sans-serif;fill:#665f68}
      .micro{font:700 25px Arial,sans-serif;letter-spacing:1.5px;fill:#8d4e63}
      .cream{fill:#fffaf2}
      .dark{fill:#2d2730}
      .rose-line{fill:none;stroke:#a55570;stroke-width:4;stroke-linecap:round;marker-end:url(#arrowRose)}
      .network{fill:none;stroke:#fffaf2;stroke-width:3;opacity:.9}
      .network-dark{fill:none;stroke:#3e6e65;stroke-width:3;opacity:.9}
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="1118" rx="34" fill="#f6f1e8" stroke="#d9d0c3" stroke-width="2"/>
  <text x="42" y="57" class="kicker">THE CENTRAL PROPOSITION</text>
  <text x="42" y="114" class="display">AI makes science</text>
  <text x="42" y="166" class="display">itself explorable.</text>
  <text x="42" y="210" class="subtitle">Not only questions within science—</text>
  <text x="42" y="244" class="subtitle">but the system that asks them.</text>

  <rect x="30" y="278" width="660" height="630" rx="32" fill="#ecefe9"/>
  <text x="60" y="323" class="kicker" fill="#557f76">DESIGN SPACE OF SCIENCE</text>
  <text x="60" y="365" class="section">Today’s arrangement is one</text>
  <text x="60" y="402" class="section">possibility, not the boundary.</text>

  <!-- The inherited system -->
  <circle cx="180" cy="522" r="82" class="dark"/>
  <path d="M145 493L184 475L220 503L207 548L164 560L139 529Z M145 493L207 548 M184 475L164 560 M220 503L139 529" class="network"/>
  <circle cx="145" cy="493" r="8" class="cream"/><circle cx="184" cy="475" r="8" class="cream"/>
  <circle cx="220" cy="503" r="8" class="cream"/><circle cx="207" cy="548" r="8" class="cream"/>
  <circle cx="164" cy="560" r="8" class="cream"/><circle cx="139" cy="529" r="8" class="cream"/>
  <text x="180" y="630" text-anchor="middle" class="micro">INHERITED</text>
  <text x="180" y="661" text-anchor="middle" class="micro">SYSTEM</text>

  <path d="M271 522H321" class="rose-line"/>
  <rect x="338" y="443" width="300" height="158" rx="24" fill="#f7e7ed" stroke="#c97894" stroke-width="2"/>
  <text x="488" y="482" text-anchor="middle" class="micro">AI SCIENTIST AS AN</text>
  <text x="488" y="514" text-anchor="middle" class="micro">EXPERIMENTAL MEDIUM</text>
  <text x="488" y="557" text-anchor="middle" class="label">Build · run · compare</text>

  <path d="M488 602V655" class="rose-line"/>

  <!-- Plural possible sciences -->
  <circle cx="170" cy="746" r="66" fill="#fffaf2" stroke="#6f9c91" stroke-width="2"/>
  <path d="M141 727L175 711L202 739L187 774L149 763Z M141 727L187 774 M175 711L149 763" class="network-dark"/>
  <circle cx="141" cy="727" r="7" fill="#6f9c91"/><circle cx="175" cy="711" r="7" fill="#6f9c91"/>
  <circle cx="202" cy="739" r="7" fill="#6f9c91"/><circle cx="187" cy="774" r="7" fill="#6f9c91"/><circle cx="149" cy="763" r="7" fill="#6f9c91"/>

  <rect x="294" y="680" width="132" height="132" rx="66" fill="#fffaf2" stroke="#6f9c91" stroke-width="2"/>
  <path d="M326 746H394M360 715V777M326 746L360 715L394 746L360 777Z" class="network-dark"/>
  <circle cx="326" cy="746" r="7" fill="#6f9c91"/><circle cx="394" cy="746" r="7" fill="#6f9c91"/>
  <circle cx="360" cy="715" r="7" fill="#6f9c91"/><circle cx="360" cy="777" r="7" fill="#6f9c91"/>

  <rect x="484" y="680" width="132" height="132" rx="22" fill="#fffaf2" stroke="#6f9c91" stroke-width="2"/>
  <path d="M510 720H590M510 746H590M510 772H590" class="network-dark"/>
  <circle cx="532" cy="720" r="7" fill="#6f9c91"/><circle cx="573" cy="720" r="7" fill="#6f9c91"/>
  <circle cx="520" cy="746" r="7" fill="#6f9c91"/><circle cx="550" cy="746" r="7" fill="#6f9c91"/><circle cx="580" cy="746" r="7" fill="#6f9c91"/>
  <circle cx="532" cy="772" r="7" fill="#6f9c91"/><circle cx="573" cy="772" r="7" fill="#6f9c91"/>

  <text x="360" y="858" text-anchor="middle" class="micro">MANY POSSIBLE SCIENCES</text>
  <text x="360" y="889" text-anchor="middle" class="small">Actors · knowledge · evaluation · resources · authority</text>

  <rect x="42" y="938" width="636" height="82" rx="24" fill="#dfece8" stroke="#7da69d" stroke-width="2"/>
  <text x="360" y="973" text-anchor="middle" class="label">IMAGINE → BUILD → TEST → SHARE → FORK</text>
  <text x="360" y="1004" text-anchor="middle" class="small">Learning accumulates only when experiments connect.</text>

  <text x="360" y="1060" text-anchor="middle" class="small">Do not only predict how AI will change science.</text>
  <text x="360" y="1098" text-anchor="middle" style="font:500 28px Georgia,serif;fill:#29242b">Ask what sciences we want to make possible.</text>
</svg>
