<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="578" viewBox="0 0 1180 578" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="s-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(244,241,234,0.30)"/>
    </marker>
    <marker id="s-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f6c87a"/>
    </marker>
    <marker id="s-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7fffe1"/>
    </marker>
  </defs>

  <rect width="1180" height="578" fill="#08080b"/>

  <!-- ======================= LEFT: PUBLISHED ======================= -->
  <text x="60" y="58" fill="rgba(244,241,234,0.38)" font-size="12.5" letter-spacing="3.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PUBLISHED, SEPARATELY</text>

  <!-- source cards -->
  <g>
    <rect x="60" y="88" width="300" height="46" rx="9" fill="#0d0d11" stroke="rgba(244,241,234,0.12)"/>
    <text x="78" y="109" fill="rgba(244,241,234,0.72)" font-size="12.5">NISTEP science &amp; technology indicators</text>
    <text x="78" y="125" fill="rgba(244,241,234,0.36)" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">192 .xlsx tables &#183; annual</text>
  </g>
  <g>
    <rect x="60" y="146" width="300" height="46" rx="9" fill="#0d0d11" stroke="rgba(244,241,234,0.12)"/>
    <text x="78" y="167" fill="rgba(244,241,234,0.72)" font-size="12.5">CSTI science &amp; technology budget</text>
    <text x="78" y="183" fill="rgba(244,241,234,0.36)" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.pdf &#183; older editions 404 after a few years</text>
  </g>
  <g>
    <rect x="60" y="204" width="300" height="46" rx="9" fill="#0d0d11" stroke="rgba(244,241,234,0.12)"/>
    <text x="78" y="225" fill="rgba(244,241,234,0.72)" font-size="12.5">Administrative project review (RS)</text>
    <text x="78" y="241" fill="rgba(244,241,234,0.36)" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bulk .csv &#183; every contract, no S&amp;T flag</text>
  </g>
  <g>
    <rect x="60" y="262" width="300" height="46" rx="9" fill="#0d0d11" stroke="rgba(244,241,234,0.12)"/>
    <text x="78" y="283" fill="rgba(244,241,234,0.72)" font-size="12.5">Basic Plans, 1st &#8211; 7th</text>
    <text x="78" y="299" fill="rgba(244,241,234,0.36)" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.pdf prose &#183; targets in an annex</text>
  </g>
  <g>
    <rect x="60" y="320" width="300" height="46" rx="9" fill="#0d0d11" stroke="rgba(244,241,234,0.12)"/>
    <text x="78" y="341" fill="rgba(244,241,234,0.72)" font-size="12.5">e-Stat &#183; OECD &#183; OpenAlex</text>
    <text x="78" y="357" fill="rgba(244,241,234,0.36)" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">APIs &#183; different units, years, definitions</text>
  </g>
  <g>
    <rect x="60" y="378" width="300" height="46" rx="9" fill="#0d0d11" stroke="rgba(244,241,234,0.10)" stroke-dasharray="3 3"/>
    <text x="78" y="399" fill="rgba(244,241,234,0.52)" font-size="12.5">Intl. research exchange survey</text>
    <text x="78" y="415" fill="#f6c87a" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" opacity="0.8">numbers exist only as pixels in a chart</text>
  </g>

  <text x="60" y="452" fill="rgba(244,241,234,0.30)" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&#8230; 16 pipelines in all</text>

  <!-- the gap -->
  <text x="60" y="534" fill="rgba(244,241,234,0.46)" font-size="13" font-style="italic">Every number here is public.</text>
  <text x="60" y="556" fill="rgba(244,241,234,0.46)" font-size="13" font-style="italic">None of them are next to each other.</text>

  <!-- ======================= ARROWS ======================= -->
  <line x1="372" y1="256" x2="452" y2="256" stroke="rgba(244,241,234,0.30)" stroke-width="1.6" marker-end="url(#s-faint)"/>
  <text x="412" y="242" fill="rgba(244,241,234,0.34)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">parse</text>

  <!-- ======================= MIDDLE: ASSEMBLY ======================= -->
  <rect x="462" y="120" width="248" height="272" rx="14" fill="#0b0b0f" stroke="rgba(246,200,122,0.28)"/>
  <text x="586" y="152" fill="#f6c87a" font-size="11.5" letter-spacing="3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ASSEMBLY</text>

  <line x1="486" y1="170" x2="686" y2="170" stroke="rgba(244,241,234,0.10)"/>

  <text x="486" y="196" fill="rgba(244,241,234,0.66)" font-size="12">reconcile units and years</text>
  <text x="486" y="222" fill="rgba(244,241,234,0.66)" font-size="12">check parsed values against</text>
  <text x="486" y="238" fill="rgba(244,241,234,0.66)" font-size="12">figures stated in the source</text>
  <text x="486" y="264" fill="rgba(244,241,234,0.66)" font-size="12">accumulate editions that</text>
  <text x="486" y="280" fill="rgba(244,241,234,0.66)" font-size="12">will disappear from the web</text>
  <text x="486" y="306" fill="rgba(244,241,234,0.66)" font-size="12">label every series</text>
  <text x="486" y="330" fill="#7fffe1" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">direct</text>
  <text x="556" y="330" fill="#f6c87a" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">proxy</text>
  <text x="626" y="330" fill="rgba(244,241,234,0.36)" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">unmeasured</text>
  <text x="486" y="360" fill="rgba(244,241,234,0.40)" font-size="11">keep the link back to the original</text>

  <line x1="722" y1="256" x2="802" y2="256" stroke="#f6c87a" stroke-width="1.6" marker-end="url(#s-amber)"/>
  <text x="762" y="242" fill="rgba(246,200,122,0.72)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">join</text>

  <!-- ======================= RIGHT: OBSERVABLE ======================= -->
  <text x="812" y="58" fill="rgba(244,241,234,0.38)" font-size="12.5" letter-spacing="3.4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ONE SURFACE</text>

  <rect x="812" y="88" width="308" height="336" rx="14" fill="#0d0d11" stroke="rgba(127,255,225,0.24)"/>

  <g font-size="12.5" fill="rgba(244,241,234,0.78)">
    <rect x="836" y="116" width="260" height="42" rx="8" fill="#101015" stroke="rgba(244,241,234,0.10)"/>
    <text x="854" y="142">Signals &#8212; what was published today</text>
  </g>
  <g font-size="12.5" fill="rgba(244,241,234,0.78)">
    <rect x="836" y="166" width="260" height="42" rx="8" fill="#101015" stroke="rgba(244,241,234,0.10)"/>
    <text x="854" y="192">Policy &#8212; 30 years of plans and targets</text>
  </g>
  <g font-size="12.5" fill="rgba(244,241,234,0.78)">
    <rect x="836" y="216" width="260" height="42" rx="8" fill="#101015" stroke="rgba(244,241,234,0.10)"/>
    <text x="854" y="242">People &#8212; doctoral pipeline, mobility</text>
  </g>
  <g font-size="12.5" fill="rgba(244,241,234,0.78)">
    <rect x="836" y="266" width="260" height="42" rx="8" fill="#101015" stroke="rgba(244,241,234,0.10)"/>
    <text x="854" y="292">Money &#8212; budget, contracts, accounts</text>
  </g>
  <g font-size="12.5" fill="rgba(244,241,234,0.78)">
    <rect x="836" y="316" width="260" height="42" rx="8" fill="#101015" stroke="rgba(244,241,234,0.10)"/>
    <text x="854" y="342">Research &#8212; output, fields, practice</text>
  </g>
  <text x="836" y="390" fill="rgba(244,241,234,0.34)" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~40 chapters &#183; each chart names its source</text>

  <!-- provenance return arrow -->
  <path d="M 966 440 C 966 484, 966 484, 660 484 C 400 484, 300 484, 300 434"
        fill="none" stroke="#7fffe1" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.6" marker-end="url(#s-cyan)"/>
  <text x="600" y="504" fill="rgba(127,255,225,0.72)" font-size="11.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every figure keeps a path back to the primary source</text>
</svg>
